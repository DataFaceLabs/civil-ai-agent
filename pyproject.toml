[project]
name = "civilai-agent"
version = "0.1.0-dev"
description = "Civil AI Strands agent — parcel feasibility workflows, tools, and evals."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "DataFace Labs" }]

dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "strands-agents>=1.0",
    "boto3>=1.43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]
# Dev-only local HTTP wrapper (civilai-agent serve) -- not part of the production
# agent runtime, which is invoked via runner.run_agent() from AgentCore/the platform.
serve = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
civilai-agent = "civilai_agent.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/civilai_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["civilai_agent"]
