# Seed registry of unstructured / semi-structured knowledge sources for the Civil Analyst
# agent. Not exhaustive -- a starting spread across all nine categories. Add entries by
# following docs/agent-knowledge-sources.md. URLs are omitted (null) where not yet pinned;
# the structure is complete and every field is optional except the required core
# (source_id, name, source_category, authority_level).
#
# INVARIANT (enforced in code, not just here): authority_level of prior_report / secondary
# / alert can never set can_support_final_finding: true -- the registry refuses to load it.
#
# last_checked_at on scheduled sources is a seed placeholder; the real refresh job updates
# it. Staleness is computed from it against refresh_cadence.

sources:
  # --- 1. regulatory_authority ---------------------------------------------------------
  - source_id: coa_ldc
    name: City of Austin Land Development Code
    description: Adopted Title 25 Land Development Code governing zoning, site plans, subdivision, drainage, and environment within Austin jurisdiction.
    source_category: regulatory_authority
    authority_level: regulatory
    jurisdiction: City of Austin
    applicable_cities: [austin]
    applicable_counties: [travis]
    applicable_domains: [zoning, platting, impervious_cover, drainage, water_quality, environmental_constraints, easements_setbacks, permitting]
    publisher: City of Austin
    url: https://library.municode.com/tx/austin/codes/land_development_code
    document_type: municipal_code
    file_format: html
    refresh_cadence: on_version_change
    last_checked_at: 2026-08-06
    version: "fixture-2026-08-06"
    confidence_default: 0.9
    citation_required: true
    can_support_final_finding: true
    requires_human_confirmation: false

